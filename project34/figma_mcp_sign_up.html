<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up for Adam’s Service</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f5f7fb;
        color: #222222;
      }

      .card {
        width: min(100%, 380px);
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }

      .title {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.1;
      }

      .tabs {
        display: flex;
        gap: 24px;
        margin-bottom: 32px;
      }

      .tab {
        position: relative;
        border: none;
        background: transparent;
        font-size: 14px;
        font-weight: 700;
        color: #222222;
        padding: 0;
        cursor: pointer;
      }

      .tab.inactive {
        color: #8a8a8a;
        font-weight: 600;
      }

      .tab::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -10px;
        height: 3px;
        border-radius: 999px;
        background: transparent;
      }

      .tab.active::after {
        background: #7bb9fa;
      }

      .field {
        margin-bottom: 20px;
      }

      .field label {
        display: block;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: 600;
        color: #222222;
      }

      .field input {
        width: 100%;
        height: 48px;
        padding: 14px 16px;
        border: 1px solid #d9d9d9;
        border-radius: 12px;
        font-size: 14px;
        color: #222222;
        background: #ffffff;
      }

      .field input::placeholder {
        color: #b7bdc8;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0 28px;
        font-size: 14px;
        color: #222222;
      }

      .checkbox-row input {
        width: 18px;
        height: 18px;
        accent-color: #282828;
      }

      .checkbox-row a {
        color: #282828;
        text-decoration: underline;
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      .actions button {
        min-width: 122px;
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .actions .primary {
        background: #f34e4e;
        color: #ffffff;
      }

      .actions .secondary {
        background: #ffffff;
        color: #222222;
        border: 1px solid #d0d0d0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="title">Sign Up for Adam’s Service</h1>

      <div class="tabs">
        <button class="tab active" type="button">Individual</button>
        <button class="tab inactive" type="button">Agency</button>
        <button class="tab inactive" type="button">Government</button>
      </div>

      <form>
        <div class="field">
          <label for="full-name">Full Name</label>
          <input id="full-name" type="text" placeholder="Jane Doe" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Jane@company.com" />
        </div>

        <div class="field">
          <label for="password">Create Password</label>
          <input id="password" type="password" placeholder="" />
        </div>

        <div class="checkbox-row">
          <input id="agree" type="checkbox" />
          <label for="agree">I agree to the <a href="#">terms</a></label>
        </div>

        <div class="actions">
          <button class="primary" type="submit">Sign up</button>
          <button class="secondary" type="button">Cancel</button>
        </div>
      </form>
    </main>
  </body>
</html>
